# Reusable workflow: build a Windows PyInstaller executable and 
# publish it as a beta GitHub release.
#
# Call from another repository:
#
#   jobs:
#     release:
#       uses: Carmenda-nl/carmenda-workflows/.github/workflows/python-release-beta.yml@main
#       with:
#         working-directory: app
#         build-name: my-product
#         version-file: app/main/VERSION
#       secrets: inherit

name: Beta release

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing pyproject.toml
        type: string
        default: app
      build-name:
        description: Name of the PyInstaller output folder under dist
        type: string
        required: true
      version-file:
        description: Path to the version file
        type: string
        default: app/main/VERSION

jobs:
  build-beta-windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set version file to release tag
        shell: bash
        run: |
          printf '%s' "${{ github.ref_name }}" > ${{ inputs.version-file }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: uv sync --group build

      - name: Build windows executable
        working-directory: ${{ inputs.working-directory }}
        run: uv run pyinstaller ../build.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ inputs.build-name }}
          path: ${{ inputs.working-directory }}/dist/${{ inputs.build-name }}/
          include-hidden-files: true

  create-beta-release:
    needs: build-beta-windows
    uses: ./.github/workflows/create-release.yml
    with:
      artifact-name: ${{ inputs.build-name }}
      zip-name: ${{ inputs.build-name }}_win_${{ github.ref_name }}.zip
      flatten: false
      release-tag: ${{ github.ref_name }}
      release-name: "Beta release ${{ github.ref_name }}"
      is-prerelease: true
      version-file: ${{ inputs.version-file }}
    secrets: inherit
