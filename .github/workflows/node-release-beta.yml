# Reusable workflow: build a Windows installer for an Electron app and
# publish it as a beta GitHub release.
#
# Call from another repository:
#
#   jobs:
#     release:
#       uses: Carmenda-nl/carmenda-workflows/.github/workflows/node-release-beta.yml@main
#       with:
#         build-name: privacytool
#         version: ${{ github.ref_name }}
#         api-gateway-repo: Carmenda-nl/privacytool-api-gateway
#         engines: |
#           [{"name": "carmenda-deduce-engine", "repo": "Carmenda-nl/carmenda-deduce-engine"}]
#       secrets: inherit

name: Beta release

on:
  workflow_call:
    inputs:
      build-name:
        description: Directory containing package.json
        type: string
        default: app
      version:
        description: Release tag to publish
        required: true
        type: string
      api-gateway-repo:
        description: API gateway release to bundle
        required: true
        type: string
      engines:
        description: JSON array of engines to bundle
        required: true
        type: string

jobs:
  build-beta-windows:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.meta.outputs.release_tag }}
      # is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      # release_name: ${{ steps.meta.outputs.release_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.x"
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: ${{ inputs.build-name }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ inputs.build-name }}
        run: pnpm install --frozen-lockfile

      - name: Exclude backend folder from Windows Defender
        shell: powershell
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\${{ inputs.build-name }}\backend"

      - name: Set version from release tag
        working-directory: ${{ inputs.build-name }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          pnpm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Generate production .env
        working-directory: ${{ inputs.build-name }}
        shell: bash
        env:
          ENGINES_JSON: ${{ inputs.engines }}
        run: |
          SECRET_KEY=$(openssl rand -base64 48)
          echo "::add-mask::$SECRET_KEY"

          # Build ENGINES='{"<name>": {"url":..., "port":..., "m2m_hash":...}}',
          # one entry per engine, ports assigned sequentially from 8001.
          ENGINES="{}"
          PORT=8001
          while IFS= read -r engine; do
            NAME=$(jq -r '.name' <<< "$engine")
            M2M_HASH=$(openssl rand -hex 32)
            echo "::add-mask::$M2M_HASH"

            ENGINES=$(jq -c \
              --arg name "$NAME" \
              --arg port "$PORT" \
              --arg hash "$M2M_HASH" \
              '. + {($name): {url: "http://127.0.0.1", port: $port, m2m_hash: $hash}}' \
              <<< "$ENGINES")
            PORT=$((PORT + 1))
          done < <(jq -c '.[]' <<< "$ENGINES_JSON")

          cat > .env <<EOF
          # ------------------------------- Gateway -------------------------------- #

          GATEWAY_HOST=127.0.0.1
          GATEWAY_PORT=8000
          GATEWAY_DEBUG=False
          GATEWAY_LOG_LEVEL=INFO
          GATEWAY_SECRET_KEY='$SECRET_KEY'
          GATEWAY_CSRF_TRUSTED_ORIGINS=http://127.0.0.1

          # -------------------------------- Engines -------------------------------- #

          ENGINES='$ENGINES'
          EOF

      - name: Download API gateway (latest)
        working-directory: ${{ inputs.build-name }}
        shell: bash
        env:
          API_GATEWAY_REPO: ${{ inputs.api-gateway-repo }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "gh release download" without a tag only ever considers /releases/latest,
          # which excludes prereleases — resolve manually so betas are picked up too.
          TAG=$(gh api "repos/$API_GATEWAY_REPO/releases" --jq '
            [
              .[]
              | select(.tag_name | test("^v\\d+\\.\\d+\\.\\d+"))
              | {
                  tag: .tag_name,
                  base: (.tag_name | sub("^v"; "") | split("-")[0]),
                  stableRank: (if .prerelease then 0 else 1 end)
                }
            ]
            | sort_by([(.base | split(".") | map(tonumber)), .stableRank])
            | (last? | .tag) // empty
          ')
          echo "Resolved latest API gateway tag: $TAG"

          if [ -z "$TAG" ]; then
            echo "No API gateway release found" >&2
            exit 1
          fi

          echo "Downloading API gateway from tag: $TAG"
          gh release download "$TAG" -R "$API_GATEWAY_REPO" -p "*win*.zip" -O gateway.zip

          echo "Extracting API gateway..."
          rm -rf backend/gateway
          mkdir -p backend/gateway
          unzip -q gateway.zip -d backend/gateway
          rm gateway.zip
          echo "API gateway downloaded and extracted"

      - name: Download engines (latest)
        working-directory: ${{ inputs.build-name }}
        shell: bash
        env:
          ENGINES_JSON: ${{ inputs.engines }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$ENGINES_JSON" | jq -c '.[]' | while IFS= read -r engine; do
            NAME=$(jq -r '.name' <<< "$engine")
            REPO=$(jq -r '.repo' <<< "$engine")

            # "gh release download" without a tag only ever considers /releases/latest,
            # which excludes prereleases — resolve manually so betas are picked up too.
            TAG=$(gh api "repos/$REPO/releases" --jq '
              [
                .[]
                | select(.tag_name | test("^v\\d+\\.\\d+\\.\\d+"))
                | {
                    tag: .tag_name,
                    base: (.tag_name | sub("^v"; "") | split("-")[0]),
                    stableRank: (if .prerelease then 0 else 1 end)
                  }
              ]
              | sort_by([(.base | split(".") | map(tonumber)), .stableRank])
              | (last? | .tag) // empty
            ')
            echo "Resolved latest tag for $NAME: $TAG"

            if [ -z "$TAG" ]; then
              echo "No release found for engine $NAME ($REPO)" >&2
              exit 1
            fi

            echo "Downloading engine $NAME from tag: $TAG"
            gh release download "$TAG" -R "$REPO" -p "*win*.zip" -O "$NAME.zip"

            echo "Extracting engine $NAME..."
            rm -rf "backend/engines/$NAME"
            mkdir -p "backend/engines/$NAME"
            unzip -q "$NAME.zip" -d "backend/engines/$NAME"
            rm "$NAME.zip"
            echo "Engine $NAME downloaded and extracted"
          done

      - name: Build and package Windows installer
        working-directory: ${{ inputs.build-name }}
        run: pnpm build:win

      - name: Store build
        shell: bash
        run: |
          mkdir -p signed-dist
          cp ${{ inputs.build-name }}/dist/*.exe signed-dist/

      - name: Determine release metadata
        id: meta
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.version }}
        run: |
          TAG="$INPUT_RELEASE_TAG"

          IS_PRERELEASE=false
          if [[ "$TAG" == *-beta ]]; then
            IS_PRERELEASE=true
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            NAME="Beta release $TAG"
          else
            NAME="Release $TAG"
          fi

          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "release_name=$NAME" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-windows
          path: signed-dist/*.exe

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: frontend-windows
          path: signed

      - name: Create zip archive
        run: |
          zip -j Privacytool_win_${{ needs.build-windows.outputs.release_tag }}.zip signed/*.exe
          ls -lh *.zip

      - name: Remove beta tag locally for release notes generation
        if: contains(needs.build-windows.outputs.release_tag, '-beta')
        run: git tag -d "${{ needs.build-windows.outputs.release_tag }}" || true

      - name: Get release notes
        id: release_notes
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ needs.build-windows.outputs.release_tag }} --strip header

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          BODY=$(cat git-cliff/CHANGELOG.md)
          {
            echo "body<<EOFMARKER"
            echo ""
            echo "$BODY"
            echo "EOFMARKER"
          } >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build-windows.outputs.release_tag }}
          name: ${{ needs.build-windows.outputs.release_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ needs.build-windows.outputs.is_prerelease }}
          draft: false
          fail_on_unmatched_files: false
          generate_release_notes: false
          files: "*.zip"

      - name: Check for existing changelog entry
        id: changelog_check
        shell: bash
        run: |
          VERSION="${{ needs.build-windows.outputs.release_tag }}"
          VERSION="${VERSION#v}"
          if grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "Entry for ${VERSION} already present, skipping changelog update"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Update CHANGELOG.md
        if: steps.changelog_check.outputs.exists == 'false'
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ needs.build-windows.outputs.release_tag }} --prepend CHANGELOG.md

      - name: Commit CHANGELOG.md
        if: steps.changelog_check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(release): update CHANGELOG.md for ${{ needs.build-windows.outputs.release_tag }}"
          git push origin HEAD:develop
