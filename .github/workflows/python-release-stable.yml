# Reusable workflow: promote the latest beta release to a stable release.
# Downloads the beta assets, patches the bundled version file to strip the
# -beta suffix, repackages them, and creates a new stable release.
#
# Call from another repository:
#
#   jobs:
#     promote-beta-to-stable:
#       if: >
#         github.event.pull_request.merged == true &&
#         github.event.pull_request.base.ref == 'main' &&
#         github.event.pull_request.head.ref == 'develop'
#       uses: Carmenda-nl/carmenda-workflows/.github/workflows/python-release-stable.yml@main
#       with:
#         version-file: app/main/_version.py
#       secrets: inherit

name: Promote Beta to Stable release

on:
  workflow_call:
    inputs:
      version-file:
        description: Path of the version file inside the app source
        type: string
        default: app/main/_version.py

jobs:
  promote-beta-to-stable:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Determine beta tag to promote
        id: determine_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JQ_FILTER='[.[] | select(.prerelease==true and (.tag_name | contains("-beta")))]'
          JQ_FILTER="$JQ_FILTER | sort_by(.created_at) | last | .tag_name"
          BETA_TAG=$(gh api repos/${{ github.repository }}/releases --jq "$JQ_FILTER")

          if [ -z "$BETA_TAG" ] || [ "$BETA_TAG" = "null" ]; then
            echo "::error::No beta release found to promote"
            exit 1
          fi

          STABLE_TAG="${BETA_TAG%-beta}"
          echo "beta_tag=$BETA_TAG" >> $GITHUB_OUTPUT
          echo "stable_tag=$STABLE_TAG" >> $GITHUB_OUTPUT
          echo "Will promote $BETA_TAG → $STABLE_TAG"

      - name: Remove beta tag locally for release notes generation
        run: git tag -d "${{ steps.determine_tag.outputs.beta_tag }}" || true

      - name: Get release notes
        id: release_notes
        uses: orhun/git-cliff-action@v4.8.0
        with:
          config: cliff.toml
          args: --tag ${{ steps.determine_tag.outputs.stable_tag }} --unreleased --strip header
        env:
          OUTPUT: release_notes.md

      - name: Download and repackage beta release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          cd assets
          gh release download "${{ steps.determine_tag.outputs.beta_tag }}" -R ${{ github.repository }}

          for file in *-beta.zip; do
            if [ -f "$file" ]; then
              newname="${file//-beta.zip/.zip}"
              extract_dir="${file%.zip}_extracted"

              mkdir -p "$extract_dir"
              unzip -q "$file" -d "$extract_dir"

              version_file="$extract_dir/_internal/${{ inputs.version-file }}"

              if [ -f "$version_file" ]; then
                echo "__version__ = '${{ steps.determine_tag.outputs.stable_tag }}'" > "$version_file"
                echo "Patched bundled version file to ${{ steps.determine_tag.outputs.stable_tag }}"
              else
                echo "::warning::Bundled version file not found at $version_file"
              fi

              (cd "$extract_dir" && zip -qr "../$newname" .)
              rm -rf "$extract_dir" "$file"
              echo "Repackaged: $file → $newname"
            fi
          done

          ls -lh

      - name: Create stable release from beta
        id: create_stable_from_beta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd assets
          gh release create "${{ steps.determine_tag.outputs.stable_tag }}" \
            --title "Release ${{ steps.determine_tag.outputs.stable_tag }}" \
            --notes-file ../release_notes.md \
            --repo ${{ github.repository }} \
            *.zip
          echo "Created stable release from beta"
          echo "success=true" >> $GITHUB_OUTPUT

      - name: Delete beta release and tag
        if: steps.create_stable_from_beta.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.determine_tag.outputs.beta_tag }}" -R ${{ github.repository }} --yes
          echo "Deleted beta release"

          gh api -X DELETE \
            "repos/${{ github.repository }}/git/refs/tags/${{ steps.determine_tag.outputs.beta_tag }}" \
            || echo "Tag already deleted"
          echo "Deleted beta tag"

          echo "Promotion complete: ${{ steps.determine_tag.outputs.beta_tag }} →" \
            "${{ steps.determine_tag.outputs.stable_tag }}"
