# Reusable workflow: strip the -beta suffix from the version file and
# CHANGELOG.md on develop, so that main receives the correct stable version
# once the PR is merged manually after approval.
#
# Call from another repository:
#
#   on:
#     pull_request:
#       types: [opened]
#
#   permissions:
#     contents: write
#
#   jobs:
#     prepare-stable-version:
#       if: >
#         github.event.pull_request.base.ref == 'main' &&
#         github.event.pull_request.head.ref == 'develop'
#       uses: Carmenda-nl/carmenda-workflows/.github/workflows/prepare-stable.yml@main
#       with:
#         version-file: app/main/VERSION

name: Prepare stable version

on:
  workflow_call:
    inputs:
      version-file:
        description: Path of the version file
        type: string
        required: true
      changelog-file:
        description: Path to the changelog file
        type: string
        default: CHANGELOG.md

jobs:
  prepare-stable-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout develop
        uses: actions/checkout@v7.0.1
        with:
          ref: develop
          fetch-depth: 0

      - name: Determine stable version
        id: version
        run: |
          VERSION=$(cat ${{ inputs.version-file }})
          STABLE="${VERSION%-beta}"
          echo "stable=$STABLE" >> $GITHUB_OUTPUT
          echo "beta_no_v=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "stable_no_v=${STABLE#v}" >> $GITHUB_OUTPUT

      - name: Update version file to stable
        run: |
          printf '%s' "${{ steps.version.outputs.stable }}" > ${{ inputs.version-file }}

      - name: Strip -beta and refresh date in changelog
        env:
          BETA_VER: ${{ steps.version.outputs.beta_no_v }}
          STABLE_VER: ${{ steps.version.outputs.stable_no_v }}
          CHANGELOG_FILE: ${{ inputs.changelog-file }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)

          if grep -q "^## \[${STABLE_VER}\]" "$CHANGELOG_FILE"; then
            echo "Changelog already prepared for [${STABLE_VER}], skipping"
            exit 0
          fi

          if ! grep -q "^## \[${BETA_VER}\]" "$CHANGELOG_FILE"; then
            echo "::error::No changelog entry found for [${BETA_VER}]"
            exit 1
          fi

          sed -i -E "s/^## \[${BETA_VER}\] - .*/## [${STABLE_VER}] - ${TODAY}/" "$CHANGELOG_FILE"

      - name: Commit version and changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.version-file }} "${{ inputs.changelog-file }}"
          git diff --cached --quiet || \
            git commit -m "chore(release): prepare ${{ steps.version.outputs.stable }}"
          git push origin develop
