# Reusable workflow: build a Windows installer for an Electron app and
# publish it as a beta GitHub release.
#
# Call from another repository:
#
#   jobs:
#     release:
#       uses: Carmenda-nl/carmenda-workflows/.github/workflows/node-release-beta.yml@main
#       with:
#         build-name: privacytool
#         version: ${{ github.ref_name }}
#         api-gateway-repo: privacytool-api-gateway
#         engines: |
#           [
#             {"repo": "carmenda-deduce-engine", "appTitle": "Carmenda deduce engine", "default": true},
#             {"repo": "deidentify-engine", "appTitle": "Carmenda deidentify engine"}
#           ]
#       secrets: inherit

name: Beta release

on:
  workflow_call:
    inputs:
      build-name:
        description: Directory containing package.json
        type: string
        default: app
      version:
        description: Release tag to publish
        type: string
        required: true
      api-gateway-repo:
        description: Name of the API gateway repo to bundle
        type: string
        required: true
      engines:
        description: JSON array of engines to bundle
        type: string
        required: true

jobs:
  build-beta-windows:
    runs-on: windows-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      release_name: ${{ steps.meta.outputs.release_name }}
      gateway_tag: ${{ steps.gateway.outputs.tag }}
      engines_versions: ${{ steps.engines.outputs.versions }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.x"
          check-latest: true
          cache: "pnpm"
          cache-dependency-path: ${{ inputs.build-name }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ inputs.build-name }}
        run: pnpm install --frozen-lockfile

      - name: Exclude backend folder from Windows Defender
        shell: powershell
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\${{ inputs.build-name }}\backend"

      - name: Set version from release tag
        working-directory: ${{ inputs.build-name }}
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION%-beta}"
          pnpm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Generate production .env
        working-directory: ${{ inputs.build-name }}
        shell: bash
        run: |
          SECRET_KEY=$(openssl rand -base64 48)
          echo "::add-mask::$SECRET_KEY"

          cat > .env <<EOF
          # ------------------------------- Gateway -------------------------------- #

          GATEWAY_HOST=127.0.0.1
          GATEWAY_PORT=8000
          GATEWAY_DEBUG=False
          GATEWAY_LOG_LEVEL=INFO
          GATEWAY_SECRET_KEY='$SECRET_KEY'
          GATEWAY_CSRF_TRUSTED_ORIGINS=http://127.0.0.1
          EOF

      - name: Generate engines.json
        working-directory: ${{ inputs.build-name }}
        shell: bash
        env:
          ENGINES_JSON: ${{ inputs.engines }}
        run: |
          ENGINES_OUT="[]"
          PORT=8001
          while IFS= read -r engine; do
            NAME=$(jq -r '.repo' <<< "$engine")
            APP_TITLE=$(jq -r '.appTitle' <<< "$engine")
            IS_DEFAULT=$(jq -r '.default // false' <<< "$engine")

            ENGINES_OUT=$(jq -c \
              --arg id "$NAME" \
              --argjson port "$PORT" \
              --arg title "$APP_TITLE" \
              --argjson default "$IS_DEFAULT" \
              '. + [{id: $id, host: "127.0.0.1", port: $port, appTitle: $title, debug: false, logLevel: "INFO", default: $default}]' \
              <<< "$ENGINES_OUT")
            PORT=$((PORT + 1))
          done < <(jq -c '.[]' <<< "$ENGINES_JSON")

          echo "$ENGINES_OUT" | jq . > engines.json

          DEFAULT_COUNT=$(jq '[.[] | select(.default == true)] | length' engines.json)
          if [ "$DEFAULT_COUNT" -ne 1 ]; then
            echo "Expected exactly one engine with \"default\": true in the engines input, found $DEFAULT_COUNT" >&2
            exit 1
          fi

          cat engines.json

      - name: Download API gateway
        id: gateway
        working-directory: ${{ inputs.build-name }}
        shell: bash
        env:
          API_GATEWAY_REPO: ${{ github.repository_owner }}/${{ inputs.api-gateway-repo }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # "gh release download" without a tag only ever considers /releases/latest,
          # which excludes prereleases — resolve manually so betas are picked up too.
          TAG=$(gh api "repos/$API_GATEWAY_REPO/releases" --jq '
            [
              .[]
              | select(.tag_name | test("^v\\d+\\.\\d+\\.\\d+"))
              | {
                  tag: .tag_name,
                  base: (.tag_name | sub("^v"; "") | split("-")[0]),
                  stableRank: (if .prerelease then 0 else 1 end)
                }
            ]
            | sort_by([(.base | split(".") | map(tonumber)), .stableRank])
            | (last? | .tag) // empty
          ')
          echo "Resolved latest API gateway tag: $TAG"

          if [ -z "$TAG" ]; then
            echo "No API gateway release found" >&2
            exit 1
          fi

          echo "Downloading API gateway from tag: $TAG"
          gh release download "$TAG" -R "$API_GATEWAY_REPO" -p "*win*.zip" -O gateway.zip

          echo "Extracting API gateway..."
          rm -rf backend/gateway
          mkdir -p backend/gateway
          unzip -q gateway.zip -d backend/gateway
          rm gateway.zip
          echo "API gateway downloaded and extracted"

          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Download engines (latest)
        id: engines
        working-directory: ${{ inputs.build-name }}
        shell: bash
        env:
          ENGINES_JSON: ${{ inputs.engines }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Process substitution (not a pipe into `while`) so the loop runs in
          # the current shell — needed for VERSIONS to survive past the loop.
          VERSIONS=""
          while IFS= read -r engine; do
            NAME=$(jq -r '.repo' <<< "$engine")
            APP_TITLE=$(jq -r '.appTitle' <<< "$engine")
            REPO="$REPO_OWNER/$NAME"

            # "gh release download" without a tag only ever considers /releases/latest,
            # which excludes prereleases — resolve manually so betas are picked up too.
            TAG=$(gh api "repos/$REPO/releases" --jq '
              [
                .[]
                | select(.tag_name | test("^v\\d+\\.\\d+\\.\\d+"))
                | {
                    tag: .tag_name,
                    base: (.tag_name | sub("^v"; "") | split("-")[0]),
                    stableRank: (if .prerelease then 0 else 1 end)
                  }
              ]
              | sort_by([(.base | split(".") | map(tonumber)), .stableRank])
              | (last? | .tag) // empty
            ')
            echo "Resolved latest tag for $NAME: $TAG"

            if [ -z "$TAG" ]; then
              echo "No release found for engine $NAME ($REPO)" >&2
              exit 1
            fi

            echo "Downloading engine $NAME from tag: $TAG"
            gh release download "$TAG" -R "$REPO" -p "*win*.zip" -O "$NAME.zip"

            echo "Extracting engine $NAME..."
            rm -rf "backend/engines/$NAME"
            mkdir -p "backend/engines/$NAME"
            unzip -q "$NAME.zip" -d "backend/engines/$NAME"
            rm "$NAME.zip"
            echo "Engine $NAME downloaded and extracted"

            VERSIONS="$VERSIONS- $APP_TITLE: $TAG"$'\n'
          done < <(jq -c '.[]' <<< "$ENGINES_JSON")

          {
            echo "versions<<EOFMARKER"
            printf '%s' "$VERSIONS"
            echo "EOFMARKER"
          } >> $GITHUB_OUTPUT

      - name: Build and package Windows installer
        working-directory: ${{ inputs.build-name }}
        run: pnpm build:win

      - name: Store build
        shell: bash
        run: |
          mkdir -p signed-dist
          cp ${{ inputs.build-name }}/dist/*.exe signed-dist/

      - name: Determine release metadata
        id: meta
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.version }}
        run: |
          TAG="$INPUT_RELEASE_TAG"

          IS_PRERELEASE=false
          if [[ "$TAG" == *-beta ]]; then
            IS_PRERELEASE=true
          fi

          if [ "$IS_PRERELEASE" = "true" ]; then
            NAME="Beta release $TAG"
          else
            NAME="Release $TAG"
          fi

          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "release_name=$NAME" >> $GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: frontend-windows
          path: signed-dist/*.exe

  create-release:
    needs: build-beta-windows
    uses: ./.github/workflows/create-release.yml
    with:
      artifact-name: frontend-windows
      zip-name: ${{ inputs.build-name }}_win_${{ needs.build-beta-windows.outputs.release_tag }}.zip
      flatten: true
      release-tag: ${{ needs.build-beta-windows.outputs.release_tag }}
      release-name: ${{ needs.build-beta-windows.outputs.release_name }}
      is-prerelease: ${{ needs.build-beta-windows.outputs.is_prerelease == 'true' }}
      extra-notes: |
        **Bundled versions**
        - API gateway: ${{ needs.build-beta-windows.outputs.gateway_tag }}
        ${{ needs.build-beta-windows.outputs.engines_versions }}
    secrets: inherit
